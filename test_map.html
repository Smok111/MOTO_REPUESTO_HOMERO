<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Prueba Google Maps - Altokeyaa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
    .info { position: absolute; left: 12px; top: 12px; z-index: 10; background: rgba(255,255,255,0.9); padding:8px 12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="info">Mapa de prueba. Reemplaza <code>YOUR_API_KEY_HERE</code> por tu API Key en la etiqueta &lt;script&gt;.</div>
  <div id="map"></div>

  <script>
    function initMap() {
      const myLatLng = { lat: -12.046374, lng: -77.042793 }; // Lima (ejemplo)
      const map = new google.maps.Map(document.getElementById('map'), {
        center: myLatLng,
        zoom: 13,
      });

      new google.maps.Marker({
        position: myLatLng,
        map,
        title: 'Punto de prueba'
      });
    }
  </script>

  <!--
    IMPORTANTE:
    - Reemplaza YOUR_API_KEY_HERE por tu API Key real.
    - Si vas a probar en local con python -m http.server 8000, agrega la restricción
      http://localhost:8000/* (o el puerto que uses) en Google Cloud Console para esta key.
  -->

  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=places&callback=initMap" async defer></script>
</body>
</html>
